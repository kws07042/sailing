<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 'Sailing Simulator'</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js (WebGL 라이브러리) 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="error-log"
        style="position: absolute; top: 50px; left: 20px; color: red; z-index: 9999; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.8); padding: 10px;">
    </div>
    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            var log = document.getElementById('error-log');
            if (log) log.innerHTML += msg + ' at line ' + lineNo + '<br>';
            return false;
        };
    </script>

    <div id="title">Sailing Simulator</div>
    <div id="ui-container"
        style="position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px;">
        <button id="timeToggle"
            style="padding: 10px 20px; font-size: 16px; background-color: #333; color: white; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">Night
            Mode</button>
        <button id="weatherToggle"
            style="padding: 10px 20px; font-size: 16px; background-color: #2196F3; color: white; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">Weather:
            Clear</button>
        <button id="autoToggle"
            style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">Auto
            Pilot: OFF</button>
        <button id="shipToggle"
            style="padding: 10px 20px; font-size: 16px; background-color: #9C27B0; color: white; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">Ship:
            Steamboat</button>
    </div>
    <div id="controls"
        style="position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 1.1rem; font-weight: bold; z-index: 10;">
        <p style="margin: 5px 0;">W: Forward | S: Backward | A, D: Turn</p>
        <p style="margin: 5px 0;">Shift: Boost | Mouse Drag: Rotate Camera</p>
    </div>
    <script type="module" src="src/game.js"></script>
</body>

</html>
